name: win-write-repro
on: { push: { branches: [strandly/win-write-repro] } }
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: repro
      - name: powershell (runner default PATH, Git for Windows present)
        shell: pwsh
        working-directory: repro
        run: |
          "### powershell (runner default PATH) ###" | Out-File -Append -Encoding utf8 ..\out.txt
          $sh = Get-Command sh -ErrorAction SilentlyContinue; "where sh: $($sh.Source)" | Out-File -Append -Encoding utf8 ..\out.txt
          node repro.mjs powershell 2>&1 | Out-File -Append -Encoding utf8 ..\out.txt
      - name: powershell with Git removed from PATH (plain Windows dev box)
        shell: pwsh
        working-directory: repro
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Git' }) -join ';'
          "### powershell, Git removed from PATH ###" | Out-File -Append -Encoding utf8 ..\out.txt
          $sh = Get-Command sh -ErrorAction SilentlyContinue; "where sh: [$($sh.Source)]" | Out-File -Append -Encoding utf8 ..\out.txt
          node repro.mjs powershell-no-git-on-path 2>&1 | Out-File -Append -Encoding utf8 ..\out.txt
      - name: git bash
        shell: bash
        working-directory: repro
        run: |
          { echo "### git bash ###"; echo "sh=$(command -v sh) pwd=$(pwd) HOME=$HOME"; echo "root / maps to: $(cygpath -w /)"; ls -ld /Users 2>&1 || true; id -u -n; node repro.mjs gitbash 2>&1; } >> ../out.txt
      - name: publish output to branch
        shell: bash
        run: |
          git config user.name strandly-the-agent; git config user.email strandly-the-agent@users.noreply.github.com
          git add out.txt && git commit -m "repro output [skip ci]" && git push
