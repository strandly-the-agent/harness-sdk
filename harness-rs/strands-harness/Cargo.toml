[package]
name = "strands-harness"
description = "The Strands Agents harness for Rust: a ready-to-run agent with built-in tools and defaults."
readme = "../README.md"
keywords = ["agents", "ai", "llm", "harness"]
categories = ["api-bindings", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["bedrock"]
bedrock = ["strands/bedrock"]
anthropic = ["strands/anthropic"]
openai = ["strands/openai"]
otel = ["strands/otel"]

[dependencies]
strands = { workspace = true, features = ["mcp"] }
monty.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bon.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
