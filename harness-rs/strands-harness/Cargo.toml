[package]
name = "strands-harness"
description = "The Strands Agents harness for Rust: a ready-to-run agent with built-in tools and defaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["agents", "ai", "llm", "strands", "harness"]
categories = ["api-bindings", "asynchronous"]
publish = false

[features]
default = ["bedrock"]
bedrock = ["strands/bedrock"]
anthropic = ["strands/anthropic"]
openai = ["strands/openai"]
otel = ["strands/otel"]

[dependencies]
strands = { workspace = true, features = ["mcp"] }
monty.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
