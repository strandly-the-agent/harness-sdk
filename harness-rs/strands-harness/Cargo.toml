[package]
name = "strands-harness"
description = "The Strands Agents harness for Rust: a ready-to-run coding and task agent built on the strands SDK"
readme = "../README.md"
keywords = ["ai", "agents", "llm", "harness"]
categories = ["asynchronous"]
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["bedrock", "anthropic", "openai", "mcp", "otel"]
bedrock = ["strands/bedrock"]
anthropic = ["strands/anthropic"]
openai = ["strands/openai"]
mcp = ["strands/mcp"]
otel = ["strands/otel"]

[dependencies]
strands.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs", "io-util"] }
futures.workspace = true
async-stream.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
bon.workspace = true
tracing.workspace = true
indexmap.workspace = true
jiff.workspace = true
monty.workspace = true
regex.workspace = true
reqwest.workspace = true
base64.workspace = true
encoding_rs.workspace = true
monty-types.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
# The in-process MCP server of the delegate tests.
rmcp = { workspace = true, features = ["server"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
