[package]
name = "strands"
description = "Strands Agents SDK for Rust: a model-driven approach to building AI agents."
readme = "../README.md"
keywords = ["agents", "ai", "llm", "bedrock", "mcp"]
categories = ["api-bindings", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["bedrock"]
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-sigv4", "dep:aws-credential-types", "dep:aws-smithy-types"]
anthropic = ["dep:eventsource-stream"]
openai = ["dep:eventsource-stream"]
mcp = [
    "dep:rmcp",
    "rmcp/client",
    "rmcp/transport-child-process",
    "rmcp/transport-streamable-http-client-reqwest",
    "rmcp/auth",
    "rmcp/elicitation",
]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp"]

[dependencies]
strands-macros.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
futures.workspace = true
async-stream.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jsonschema.workspace = true
http.workspace = true
uuid.workspace = true
base64.workspace = true
jiff.workspace = true
indexmap.workspace = true
thiserror.workspace = true
bon.workspace = true
reqwest.workspace = true
htmd.workspace = true
cedar-policy.workspace = true
tracing.workspace = true

aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["http-proto", "reqwest-client", "trace", "metrics"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
wiremock.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
