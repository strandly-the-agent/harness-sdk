[package]
name = "strands"
description = "Strands Agents SDK for Rust: build AI agents with a model, a system prompt and tools"
readme = "../README.md"
keywords = ["ai", "agents", "llm", "bedrock", "mcp"]
categories = ["api-bindings", "asynchronous"]
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["bedrock"]
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-sigv4", "dep:aws-smithy-types", "dep:aws-credential-types"]
anthropic = ["dep:eventsource-stream"]
openai = ["dep:eventsource-stream"]
mcp = ["dep:rmcp"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp"]

[dependencies]
strands-macros.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "fs", "io-util"] }
futures.workspace = true
async-stream.workspace = true
async-trait.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
fastrand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_stacker.workspace = true
ryu-js.workspace = true
schemars.workspace = true
jsonschema.workspace = true
http.workspace = true
uuid.workspace = true
base64.workspace = true
jiff.workspace = true
indexmap.workspace = true
regex.workspace = true
thiserror.workspace = true
bon.workspace = true
reqwest.workspace = true
htmd.workspace = true
cedar-policy.workspace = true
process-wrap.workspace = true
tracing.workspace = true

aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
