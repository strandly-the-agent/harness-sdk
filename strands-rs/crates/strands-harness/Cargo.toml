[package]
name = "strands-harness"
description = "Strands harness: a preconfigured, opinionated Strands agent in one call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["bedrock", "http"]
http = ["dep:reqwest"]
bedrock = ["strands-agents/bedrock"]

[dependencies]
strands-agents = { path = "../strands-agents", default-features = false, features = ["macros"] }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
schemars.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
strands-agents = { path = "../strands-agents", features = ["test-support"] }
tempfile.workspace = true
