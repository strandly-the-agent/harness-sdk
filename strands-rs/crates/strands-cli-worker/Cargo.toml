[package]
name = "strands-cli-worker"
description = "Rust runtime for the Strands CLI: speaks the CLI worker protocol over stdin/fd 3 and drives a strands-harness agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Workspace lints, except `unsafe_code` is `deny` instead of `forbid`: `message_output` needs one
# `dup(3)` to adopt the pipe the CLI hands us (see the SAFETY note there).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[[bin]]
name = "strands-cli-worker"
path = "src/main.rs"

[dependencies]
strands-agents = { path = "../strands-agents", default-features = false }
strands-harness = { path = "../strands-harness" }
futures.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
strands-agents = { path = "../strands-agents", features = ["test-support"] }
tempfile.workspace = true
