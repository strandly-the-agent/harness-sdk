[package]
name = "strands-agents"
description = "Strands Agents SDK for Rust: a model-driven framework for building AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["bedrock"]
test-support = []
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types", "dep:aws-smithy-runtime-api"]

[dependencies]
async-trait.workspace = true
async-stream.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
base64.workspace = true
futures.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
schemars.workspace = true
jsonschema.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }

[dev-dependencies]
strands-agents = { path = ".", features = ["test-support"] }
schemars.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true
tracing-subscriber.workspace = true
