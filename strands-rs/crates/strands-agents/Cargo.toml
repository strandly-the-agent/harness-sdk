[package]
name = "strands-agents"
description = "Strands Agents SDK for Rust: a model-driven framework for building AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["bedrock", "macros"]
test-support = []
macros = ["dep:strands-agents-macros"]
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
anthropic = ["dep:reqwest"]
openai = ["dep:reqwest"]
mcp = ["dep:rmcp", "dep:http", "dep:regex"]
# Internal, test-only: builds the `mcp_echo_server` binary (a minimal stdio MCP server used by
# this crate's own e2e tests). Not part of the supported public feature set; do not enable it
# from downstream crates.
mcp-echo-server = ["mcp", "rmcp/server", "rmcp/transport-io", "rmcp/macros"]
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types", "dep:aws-smithy-runtime-api"]

[dependencies]
strands-agents-macros = { path = "../strands-agents-macros", version = "0.1.0", optional = true }
async-trait.workspace = true
async-stream.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
base64.workspace = true
futures.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
schemars.workspace = true
jsonschema.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
http = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
strands-agents = { path = ".", features = ["test-support", "mcp-echo-server"] }
schemars.workspace = true
serde.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true
tracing-subscriber.workspace = true
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

# Test-only stdio MCP server used by tests/mcp_e2e.rs; never built without its feature.
[[bin]]
name = "mcp_echo_server"
path = "src/bin/mcp_echo_server.rs"
required-features = ["mcp-echo-server"]
