[package]
name = "strands-macros"
description = "Procedural macros for the Strands Agents Rust SDK: #[tool] and #[tools]"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
darling.workspace = true

[dev-dependencies]
# No version: cargo strips a path-only dev-dependency on packaging, which breaks the cycle with `strands`.
strands = { path = "../strands", default-features = false }
tokio = { workspace = true, features = ["rt", "macros"] }
trybuild.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
