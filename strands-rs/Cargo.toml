[workspace]
resolver = "2"
members = ["crates/strands-agents", "crates/strands-agents-macros", "crates/strands-harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/strands-agents/harness-sdk"
authors = ["AWS"]

[workspace.dependencies]
async-trait = "0.1"
async-stream = "0.3"
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
futures = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = "0.7"
nix = { version = "0.30", features = ["signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
schemars = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
jsonschema = { version = "0.33", default-features = false }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
regex = "1"
http = "1"
tempfile = "3"
aws-smithy-mocks = "0.3"
tokio-stream = "0.1"
rmcp = { version = "3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-semantic-conventions = "0.33"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
