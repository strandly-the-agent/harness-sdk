# cargo-deny configuration for the Rust workspace (strands-rs and harness-rs).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, no safe upgrade: atomic-polyfill comes from heapless 0.7 through postcard, a
  # required dependency of monty (programmatic_tool_caller). Not a vulnerability advisory.
  { id = "RUSTSEC-2023-0089", reason = "transitive through monty -> postcard -> heapless 0.7; no upgrade available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "BlueOak-1.0.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
# Leaf utility crates (rand, phf, sha2, syn, ...) appear in more than one version across the
# AWS SDK, cedar-policy and monty trees, so duplicates warn in general and are denied for the
# crates where two copies would mean two HTTP, TLS, runtime or telemetry stacks.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "tokio", deny-multiple-versions = true },
  { crate = "hyper", deny-multiple-versions = true },
  { crate = "http", deny-multiple-versions = true },
  { crate = "h2", deny-multiple-versions = true },
  { crate = "reqwest", deny-multiple-versions = true },
  { crate = "rustls", deny-multiple-versions = true },
  { crate = "rustls-webpki", deny-multiple-versions = true },
  { crate = "opentelemetry", deny-multiple-versions = true },
  { crate = "opentelemetry_sdk", deny-multiple-versions = true },
  { crate = "cedar-policy-core", deny-multiple-versions = true },
  { crate = "serde_json", deny-multiple-versions = true },
  { crate = "schemars", deny-multiple-versions = true },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
