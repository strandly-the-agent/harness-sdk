name: "Rust SDK: Test and Lint"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps --locked

  test:
    # `name` comes from the matrix so the Linux leg keeps a stable check name.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: strands-agents_ubuntu-latest_4-core, name: Test }
          - { os: strands-agents_windows-latest_4-core, name: Test (Windows) }
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # `cargo test` runs unit, integration and doc tests.
      - name: Test (all features, including doctests)
        run: cargo test -p strands -p strands-macros --all-features --locked

      - name: Test (no default features, including doctests)
        run: cargo test -p strands -p strands-macros --no-default-features --locked

  features:
    name: Feature check (${{ matrix.features }})
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features: [bedrock, anthropic, openai, mcp, otel, "openai,bedrock"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: cargo check -p strands --all-targets --no-default-features --features "${{ matrix.features }}" --locked

  msrv:
    name: MSRV (1.96.0)
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: cargo check --workspace --all-features --locked

  conformance:
    name: Conformance fixtures
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build strands-ts
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Regenerate fixtures
        run: |
          npm run generate --prefix strands-rs/conformance

      # A TS wire change must land together with its regenerated fixtures.
      - name: Fixtures are up to date
        run: git diff --exit-code -- strands-rs/conformance/fixtures
