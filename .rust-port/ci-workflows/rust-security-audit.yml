name: "Rust: Security Audit"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  security-audit:
    name: Cargo Deny
    permissions:
      contents: read
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check bans, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: bans licenses sources

      # Informational: full-tree advisory check for visibility into pre-existing
      # advisories. Does not block merge so unrelated PRs are not held hostage
      # by transitive vulns; drive these down via Dependabot. PR-introduced
      # vulns are gated by the repo-level Dependency Review job in ci.yml.
      - name: Check advisories (informational)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: advisories
