name: "Rust: Test and Lint"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt -p strands -p strands-macros --check

      - name: Clippy (all features)
        run: cargo clippy -p strands -p strands-macros --all-targets --all-features --locked -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy -p strands -p strands-macros --all-targets --no-default-features --locked -- -D warnings

  test:
    name: Unit Tests
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Doctests run as part of `cargo test`.
      - name: Run tests (all features)
        run: cargo test -p strands -p strands-macros --all-features --locked

      - name: Run tests (no default features)
        run: cargo test -p strands -p strands-macros --no-default-features --locked

  docs:
    name: Docs
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p strands -p strands-macros --all-features --no-deps --locked

  features:
    name: Feature ${{ matrix.feature }}
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feature: [anthropic, openai, bedrock, mcp, otel]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.feature }}

      - name: Check feature alone
        run: cargo check -p strands -p strands-macros --all-targets --no-default-features --features ${{ matrix.feature }} --locked

  msrv:
    name: MSRV
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check on MSRV
        run: cargo +1.96.0 check -p strands -p strands-macros --all-features --locked

  conformance:
    name: Conformance Fixtures
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build strands-ts
        run: npm run build

      - name: Regenerate fixtures
        working-directory: strands-rs/conformance
        run: npm run generate

      # intent-to-add makes newly generated, untracked fixtures show up in the diff.
      - name: Check fixtures are up to date
        run: |
          git add --intent-to-add -- strands-rs/conformance/fixtures
          git diff --exit-code -- strands-rs/conformance/fixtures
