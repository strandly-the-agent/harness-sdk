[package]
name = "probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
strands = { path = "/mnt/workspace/review-sdk2/strands-rs/strands", default-features = false, features = ["mcp", "otel", "anthropic", "openai"] }
tokio = { version = "1.54", features = ["full", "test-util"] }
tracing = "0.1"
futures = "0.3.34"
serde_json = "1"
async-trait = "0.1"
serde = "1"
schemars = "1"
tempfile = "3"
opentelemetry = "*"
opentelemetry_sdk = "*"
rmcp = { version = "3.10", default-features = false, features = ["server", "client"] }
