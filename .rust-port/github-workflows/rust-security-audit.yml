name: "Rust: Security Audit"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  cargo-deny:
    name: cargo deny (${{ matrix.checks }})
    permissions:
      contents: read
    runs-on: strands-agents_ubuntu-latest_4-core
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # Informational for advisories, mirroring typescript-security-audit.yml: new advisories against
    # existing dependencies should not block unrelated PRs. Bans, licenses and sources always block.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
          rust-version: 1.96.0
